resolution = "The read-only status path is bounded to 32 explicitly referenced records, eight reference levels, 256 KiB per record, 4 MiB aggregate and a five-second monotonic deadline. Directory walks, Git-history scans, symlink traversal, service-manager or proc enumeration and live-process probes are forbidden and fail closed."
