[[findings]]
id = "KERNEL-CONTRACT-REV-001"
priority = "P1"
severity = "HIGH"
consensus_count = 1
status = "resolved"
resolution = "A conflict, corruption, or contention result remains provisional until its bounded refusal audit commits within the original monotonic deadline. If no audit-start budget remains or the audit transaction fails, IDEMPOTENCY_AUDIT_UNAVAILABLE deterministically wins; no claim, operation, receipt, retry, or background continuation is created."
evidence = [
  "design.md:Bounded idempotency admission and key rotation",
  "specs/operation-control-contracts/spec.md:Deadline expires before contention audit",
  "specs/operation-control-contracts/spec.md:Refusal audit outcome priority is deterministic",
  "design-quality.toml:evidence.concurrency.capacity_validation",
  "tasks.md:3.1",
]

[[findings]]
id = "KERNEL-CONTRACT-REV-002"
priority = "P1"
severity = "HIGH"
consensus_count = 2
status = "resolved"
resolution = "Persistent trusted-clock failure now returns the sole clockless ErrorEnvelope product REPLAY_AUDIT_CLOCK_UNAVAILABLE. Its occurred_at is required absent, historical/envelope/monotonic/fallback time is forbidden, and one bounded clockless health signal distinguishes clock, transaction and persistence failure."
evidence = [
  "design.md:Bounded direct replay admission",
  "specs/operation-control-contracts/spec.md:Replay audit clock is unavailable",
  "specs/operation-control-contracts/spec.md:Exact safe operation and control errors",
  "design-quality.toml:evidence.auditability.audit_trail",
  "tasks.md:3.4",
]

[[findings]]
id = "KERNEL-CONTRACT-REV-003"
priority = "P2"
severity = "MED"
consensus_count = 2
status = "accepted"
resolution = "The platform-persistence-events-and-bootstrap-foundation child owns one common retention horizon for each replay-audit key, its audit fact and the resolvable historical OperationReceipt; runtime repository adoption cannot expire one member while direct replay can address the key."
evidence = [
  "design.md:Open questions",
  "specs/operation-control-contracts/spec.md:Bounded direct replay requires current authority and durable attribution",
]

