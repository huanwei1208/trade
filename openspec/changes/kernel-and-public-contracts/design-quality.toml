Three golden contention fixtures prove that audit commit returns IDEMPOTENCY_KEYSET_CONTENTION while no remaining audit-start budget and an in-budget audit transaction failure both return IDEMPOTENCY_AUDIT_UNAVAILABLE. No-sleep fake-clock tests cover exactly 1 and 10 owners in every residual category, exact pre-materialization wire/depth/string/integer/aggregate limits, exact UtcInstant year/second/microsecond boundaries and alternate-spelling rejection, and canonical Unicode/escape bytes on Python 3.10 and highest supported version, full QueryStatus/shutdown products, non-returning observation, cancellation, takeover/stale writer, concurrent callers and blocking executor tail. EventBus mapper tests accept 1,024 source results, refuse 1,025 plus 10x without proportional target allocation, and omit inconsistent live/persisted/replay event times. Legacy artifact fixtures require post-hash stable identity before sampling verified_at. Architecture fixtures fail closed on unresolved computed import_module, variable __import__, module __getattr__ and dynamic re-export targets outside an exact reviewed finite allowlist. One child-process fixture has a 2-second shared deadline, 250-ms tolerance and 5-second whole-fixture ceiling.
