dmission also receives a separate finite local Deadline and one remaining-time budget capped by any existing trusted owner deadline."
ordering = "Trusted actor establishment, static bounded owner-codec admission, typed DTO to exact codec-byte equality and canonical validation precede constructing an admission-local CommandEnvelope/QueryEnvelope; durable projection decode alone establishes neither authority nor deadline. Domain-separated fingerprinting and durable ingress follow current authority and fresh deadline admission. Replay authorization and exact projection-digest/identity verification precede its audit-key transaction and operation existence disclosure, and a resolved replay audit commit precedes returning the unchanged historical receipt; durable operation identity and immutable source-equal admission-deadline evidence precede OperationReceipt; a refusal audit commit precedes returning a specific idempotency conflict/corruption/contention reason, otherwise audit-unavailable wins; atomic accepted-control receipt/intent/outbox precedes any linked ShutdownReceipt, control application and terminal cancelled state; shutdown closes admission before graceful/forced cleanup, terminal audit, resource release and matching-generation fence release."
atomicity = "DTO construction is all-or-nothing and returns no partial object. A command-equivalent duplicate across active/retained HMAC versions resolves one identity; a command conflict or any multi-match returns no old receipt/new operation. Rotation and zero-match creation share key_set_generation CAS. Direct replay can only resolve a required existing operation and cannot create one; its single owner-local transaction atomically resolves the audit key, required operation and one audit row before returning the unchanged receipt. Same-key/same-binding retry returns the existing audit/receipt; conflict or audit failure returns no receipt or operation/process link. Every returned ControlReceipt and claim are atomic; accepted adds intent/outbox in that transaction, all other dispositions add neither, and persistence failure returns only CONTROL_RECEIPT_UNAVAILABLE. Observation timeout mutates no owner state. Completed shutdown is visible only with matching unverified initiator attribution/control linkage, zero residual owners, durable audit, released non-reentrant resources and release of its own fence generation; current verified authority remains separate from that durable linkage and stale generations cannot write."
timeout_cancellation = "Owner, control and observation deadlines are distinct. Each live executable retry consumes only its process-local monotonic Deadline from the matching owner/clock-domain binding and is capped by immutable operation/process admission evidence; public receipts/views retain only declared UTC expiry evidence and cannot recreate or extend a budget. Restart, transfer, lost binding, monotonic read failure, exhausted budget and evidence mismatch are distinct closed failures; UTC rollback, forward jump or unavailability never rebuilds time. Expired or clock-domain-lost owners reject work, and a new deadline requires a new causal owner identity. Control admission reserves finite receipt-finalization budget outside the wire receipt. Cancellation acceptance is not cancellation completion; once accepted/intent commits, later delivery or application timeout is observed separately and cannot become a retryable control-admission result. Signal delivery is not terminal evidence. Owner deadline_exceeded requires worker exit or a durable write fence plus recorded residual ownership; caller observation timeout never terminalizes the owner. Every lock, persistence retry, queue drain, thread/future/executor/subprocess wait and process-tree action consumes the shared remaining deadline; no bounded method may call an unbounded tail join."
backpressure = "This child has no production queue. Oversized contract input is rejected before object construction or digesting. Future interfaces return receipts and finite ProcessView observations rather than retaining one synchronous request for an entire workflow."
partial_failure = "Unknown schema/status, durable projection malformed/oversized, codec missing/identity-mismatched, owner payload invalid, registry duplicate/over-capacity/required-codec-unavailable, retention-shard contention exhaustion, required-snapshot pointer missing/non-current/incomplete/corrupt/stale-fence/timeout, owner clock domain lost/unavailable/expired/mismatched, unavailable owner, caller timeout, denied control, replay operation missing, replay binding conflict, replay-audit clock unavailable, replay-audit transaction/persistence unavailable, idempotency command conflict, claim corruption, key-set contention, refusal-audit unavailable, shutdown-control link corruption, integrity-delivery failure or delivery-outcome-unknown, stale writer, incomplete process-tree termination and closed-category residual owners remain exact safe errors or not_observed/unavailable/incomplete states; none is counted as completed, cancelled, empty or healthy."
capacity_validation = """
Deterministic tests exercise zero/one/multi-match idempotency, same-key command conflict, duplicate claims for one operation, both paused-admission/key-rotation interleavings and a fake-clock rotation storm that proves changed generation ends its attempt. Exact counters prove creation/replay/conflict each derive one command HMAC only after the stable result, conflict-to-audit-unavailable retains that one HMAC, multi-match/contention/corruption-to-audit-unavailable/contention-to-audit-unavailable/pre-admission rejection derive zero, and the maxima remain 3 claim attempts/12 candidate HMACs/1 command HMAC/13 total HMACs/3 queries/3 claim transactions/1 audit transaction.
Durable-envelope goldens freeze every framed metadata/descriptor/payload component, prove actor/deadline/attempt changes preserve bytes, reject whole admission-envelope serialization and decode without authority or budget; total overflow fails even when payload is within its descriptor limit. Owner-codec tests bind manifest digest and exact canonical round trip; counters prove one encode for fresh typed admission, one decode plus one encode for durable bytes, zero subsequent owner-codec calls, one projection buffer and no second payload-sized staging copy.
