  "kernel-primitives:Kernel SHALL contain only admitted framework-free primitives",
  "kernel-primitives:Kernel identifiers SHALL be opaque, bounded and namespace-qualified",
  "kernel-primitives:Kernel time and deadline values SHALL preserve UTC and elapsed-time semantics",
  "kernel-primitives:Content digests SHALL identify bytes with an explicit algorithm",
  "kernel-primitives:Results and structural errors SHALL be explicit and immutable",
  "kernel-primitives:Envelope metadata SHALL be transport-neutral and owner-payload typed",
]
