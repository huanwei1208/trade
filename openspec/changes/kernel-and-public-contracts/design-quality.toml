schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "The child introduces installed framework-free Kernel, Platform and Processes contract types, exact v1 wire schemas, status taxonomies and additive one-way legacy mappings while preserving every current CLI, HTTP, SSE, EventBus, job-run, artifact and console contract."

[[impacts]]
id = "persistent_write"
applies = true
reason = "This child implements no durable writer, but its public admission, idempotency fingerprint, operation receipt, fence generation, crash-takeover and terminal-audit contracts normatively govern later persistent writers. Storage evidence therefore applies as a prospective hard prerequisite rather than as authorization to write in this child."

[[impacts]]
id = "schema_migration"
applies = false
reason = "No database table, column, index, migration version, parquet layout, manifest layout or existing payload schema is altered; the new wire DTO schemas are additive public contracts covered by the contract profile."

[[impacts]]
id = "point_in_time"
applies = false
reason = "The child defines only normative owner-reference policy and explicitly defers every reference DTO, DatasetSnapshotRef, clock selection, revision policy, PIT resolution, label, forecast and backtest to its owning prerequisite child; Kernel has no reference module."

[[impacts]]
id = "predictive_model"
applies = false
reason = "No model, feature, recommendation, ranking, calibration, StudyResult or decision-support behavior is created, evaluated, promoted or served."

[[impacts]]
id = "external_event_data"
applies = false
reason = "The child performs no provider interaction, news or event-feed ingestion, capture, import, replay, payload correction, licensing decision or network access. Static owner-codec policy rejects inline external/raw bodies and requires future Capture artifact refs; a legacy EventBus mapper handles metadata only."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "The public control contracts define finite observation, cancellation and shutdown deadlines, truthful residual ownership and a prohibition on unbounded tail joins; implementation tests these contracts without rerouting the current runtime."

[evidence.contract]
contract = "The additive public contract is an installed `trade` package containing the parent-approved six Kernel modules, local execution Deadline separated from public UTC deadline evidence, admission-local non-wire CommandEnvelope/QueryEnvelope whose typed payload must byte-equal the owner codec encoding, plus one Platform-owned authority-free binary DurableEnvelopeProjectionV1 and exact projection digest, Platform ActorContext/OperationReceipt/ErrorEnvelope/control DTOs with attribution-only receipt actors, Processes ProcessView DTOs with an immutable UTC deadline, owner-local immutable-reference policy, exact bounded v1 canonical JSON with frozen Unicode/escape bytes, versioned domain-separated fingerprints and pure owner-specific one-way legacy mappers."
consumers = "The immediate consumer is the next platform-persistence-events-and-bootstrap-foundation child. Later Processes, Capture, Datasets, Studies, Decision Support, CLI, HTTP, SDK, notebook, scheduler and event children consume only reviewed target contracts. Existing trade_py/trade_web callers remain on their current paths in this child."
compatibility = "Distribution remains `trade-py`; root `./trade`, `trade-py` console entry, `trade_py` imports, CLI commands/arguments/output/exit codes, HTTP paths/methods/status/headers/payloads, SSE, EventBus topics/admission, job_runs rows, Observatory models/errors, DB schema, artifacts and native ABI remain unchanged. Target packages never import legacy implementation."
migration = "First prove explicit additive source/editable/offline-no-deps wheel package discovery using one wheel, an exact source-derived Python member/byte inventory and exactly five reviewed dist-info members; then add unused target contracts and pure owner-specific legacy-to-target mappers. No current caller is rerouted; the four compatibility modules are test-only leaf adapters with no production inbound imports; and runtime adoption is blocked on runtime-owner-shutdown-and-recovery-hardening-v1. Each later owner must provide a mutation ledger, old/new snapshots, feature gate, rollback and retirement evidence before adopting a mapper."
rollback = "Stop new child consumers, retain all legacy imports and wire paths, and revert the additive package discovery, target modules, mappers and tests. There is no database, artifact, manifest, pointer or runtime state to restore."

[evidence.storage]
authoritative_writer = "This child has no runtime durable writer and does not authorize one: existing TradeDB/EventBus/Web runtime owners remain unchanged. The later Platform persistence owner must be the sole writer for operation identity, command-admission idempotency claim, immutable OperationAdmissionDeadlineV1, every codec-dependent durable projection/replay/receipt identity, exactly 16 codec-retention shards, the fenced authoritative RequiredOwnerCodecManifestV1 snapshot and current pointer, replay-audit facts, every OperationReceipt lifecycle transition, owner lease/fence generation, terminal audit, ShutdownLinkIntegrityObservationV1, its delivery claim and outbox facts. Processes must be the sole writer for projection-independent ProcessStartKeyV1/inbox/handoff facts, immutable ProcessAdmissionDeadlineV1, Process Manager workflow state and ProcessView; it stores no owner canonical payload/projection bytes or codec manifest and cannot write a Platform retention port. One process identity has one immutable declared UTC deadline. Original interface keys, Platform HMACs and secret material never enter Processes, the owners share no transaction, and the parent ownership-table row must be governedly split to match this normative ownership before either repository is implemented."
idempotency_key = "This child defines only the contract: FingerprintV1 uses purpose-separated HMAC-SHA-256 with a >=256-bit CSPRNG secret behind a secret-store port. IdempotencySubjectV1 has exact owner-namespace, tenant, principal-kind, principal-ID and ordered delegated-subject fields framed by unsigned 4-byte big-endian lengths; mutable origin, scopes, provenance and timestamps are excluded. A future Platform owner transaction queries one active and at most three retained key-version candidates: zero matches creates after generation revalidation; one match returns only after command name/kind/fingerprint equivalence; conflict, any multi-match or exhausted key-set contention first forms a provisional refusal and returns its specific closed ErrorEnvelope only after the separate refusal audit commits within the same remaining deadline. No audit start budget or audit failure returns IDEMPOTENCY_AUDIT_UNAVAILABLE instead, always with no receipt/operation. Conflict-to-audit-unavailable retains the one command HMAC already derived to detect conflict; corruption/contention-to-audit-unavailable derives none. Processes separately deduplicates the exact non-secret ProcessStartKeyV1 process-type/operation-ID/workflow-digest tuple atomically with inbox/initial view and exposes no process fingerprint or workflow key. No key or claim is persisted by this child."
concurrency_control = "Current runtime concurrency is untouched. The future repository must serialize cross-retained-version lookup plus claim creation and key rotation under one owner CAS/lock with monotonic key_set_generation; one admission uses one monotonic deadline and at most three claim attempts, a changed generation ends that attempt and permits re-derivation only in the next, any multi-match is corruption, owner fence generation rejects every stale writer, and crash takeover requires durable lease expiry or revocation evidence. Codec-retention visibility or retirement deterministically touches at most one of 16 Platform-owned shard rows selected by the unsigned 32-bit big-endian value of the first four SHA-256 bytes modulo 16, independent of host/database/language byte order, and permits at most three CAS attempts under that same admission deadline; it never clones the whole manifest. Bootstrap/retirement closes ingress and retention-mutation admission, drains in-flight shard transactions, holds the current owner fence plus one exclusive snapshot lease, binds a stable 16-shard revision vector, and atomically switches the sole current pointer only after one complete generation/count/source-revision-digest/entry-digest-bound snapshot commits."
staging_validation = "A bounded lexical/structural scanner rejects malformed UTF-8/JSON, depth, string/integer-token, container and aggregate amplification before JSON materialization; bounded parse hooks and iterative post-check then validate exact schema, actor provenance, owner codec manifest/digest, canonical bytes, fingerprint key version, state transition and fence generation. Fresh typed payload validation performs one encode; durable bytes perform one decode plus one exact re-encode; envelope/projection creation reuses the validated immutable bytes. Receipt/view codecs accept only canonical UtcInstant deadline evidence and unverified actor attribution; they reject monotonic floats, composite Deadline values, receipt-finalization reserves and verified receipt actors before object construction. Tests use only in-memory values and temporary roots; no production row, DB or artifact is opened."
atomic_visibility = "This child publishes no runtime state. A future operation admission must make idempotency claim, operation identity, immutable OperationAdmissionDeadlineV1, initial receipt and outbox fact visible in one owner-local transaction. Successful direct replay must commit one request-causal replay audit in its single owner-local lookup transaction before returning the unchanged historical receipt; audit unavailability returns no receipt or operation/process link. Every returned ControlReceipt is atomically persisted with its exact operation/control-kind/target claim; accepted additionally persists intent/outbox, while all other dispositions persist neither. A ShutdownReceipt may link only that accepted shutdown control with exact target, causal, attribution, requested-time and UTC-deadline evidence. A completed shutdown becomes visible only with terminal audit, zero residual owners, released resources and matching-generation fence release."
crash_windows = "A crash in this child leaves no durable state. The future owner must recover pre-claim as absent, post-claim/pre-dispatch as an accepted recoverable operation, pre-replay-audit commit as no resolved replay audit/receipt response, post-replay-audit-commit/pre-response as the same audit and unchanged historical receipt without a duplicate row, pre-control-receipt commit as no control claim/receipt/intent/outbox, post-control-receipt commit as the same durable disposition with intent/outbox exactly for accepted, pre-manifest-pointer switch as the prior authoritative snapshot, post-switch as the complete matching generation, pre-shutdown-signal claim as pending, and post-signal-claim without a terminal commit as delivery_outcome_unknown after claim expiry with no automatic second external call. Post-execution/pre-terminal-audit remains unresolved residual ownership, and post-takeover rejects the old generation; no path infers completion or delivery from process disappearance."
corrupt_predecessor = "Contract decoders and mappers fail closed on malformed versions, fingerprints, transitions, codec manifests, absent/non-current snapshot pointers, non-committed/mixed/stale-fence generations, count/source-revision/entry-digest mismatches, deadline bindings, history windows and legacy paths and perform no repair. A future owner must mark corrupt or unverifiable predecessor state unavailable, preserve safe diagnostic identity and require audited operator or generation recovery. Caller/readiness codec products remain redacted while the authorized operator health projection exposes only one closed cause/action pair. Shutdown-control link corruption has one exact unavailable query product plus one idempotent integrity observation; delivery failure and delivery_outcome_unknown remain operator-visible."
partial_results = "DTO construction is all-or-nothing. A future writer must not expose a partial admission receipt, partial history window, completed shutdown with residual owners or formal reference with unresolved proof; unavailable, blocked, not_observed and incomplete remain explicit."
reader_consistency = "All current CLI, HTTP, EventBus, Data Operations, job-run and Observatory readers remain unchanged. Future readers consume one owner receipt/view generation and never join private tables across owners. A ProcessView transition cannot change its declared deadline for one process identity; operation/process retries require their matching live monotonic-clock-domain binding and never reconstruct elapsed time from UTC evidence. Restart or binding loss fails closed for that identity. An operation deadline-exceeded transition resolves the internal immutable Platform admission-deadline record, not a caller or process deadline. Repeated shutdown-corruption reads resolve one observation/outbox and cannot admit another signal. Data Operations has no canonical mapper in this child; naive mixed-origin job-run times remain bounded unproven tokens unless row-bound timezone/generation evidence exists; inconsistent live/persisted/replay EventBus time is omitted from canonical observations; mapper tests are read-only and cannot repair, retry, signal, publish or move pointers."
backup_hash_verification = "This child creates no runtime backup obligation because it writes no state. Before adoption, the runtime hardening/Platform persistence child must rehearse temporary-root backup and restore of operation/idempotency/fence/audit rows, verify row identities and canonical receipt fingerprints, and preserve the prior generation."
small_sample_verification = "Focused temporary fixtures cover one duplicate idempotency claim, one accepted operation, one same-binding replay retry, one conflicting replay binding, replay-audit pre/post-commit crashes, every allowed/forbidden transition, one stale writer, one crash takeover, one terminal-audit failure, exactly 1 and 10 owners in each residual category, and compatibility snapshots. No real data root is used."
rollback = "Before runtime adoption, revert additive package/config/contracts/mappers/tests. After a future owner adopts them, its separate child must first stop new admission, retain old compatible readers and prior fence generation, disable the new adapter and restore the verified prior owner generation without deleting audit facts."
audit_trail = """
This OpenSpec, digest-bound review, exact wire goldens, mapper lossiness inventory and git history are this child's audit evidence. Future durable receipts retain original admitted request-message/correlation/direct-causation identity, operation/control identity, unverified initiator/actor attribution, actor provenance, structured fingerprint algorithm/domain/key version, state/reason, owner instance/fence generation, stage, residual ownership, declared canonical UTC deadline fields and safe errors without raw secrets.
OperationReceipt intentionally has no deadline; Platform owns its internal non-re-exported OperationAdmissionDeadlineV1 and live OperationDeadlineRuntimeBindingV1, while Processes owns ProcessAdmissionDeadlineV1 and ProcessDeadlineRuntimeBindingV1. Durable UTC evidence exactly copies the trusted admitted deadline without resampling; only a matching live monotonic-clock-domain binding authorizes same-owner retry. Restart or binding loss returns OWNER_DEADLINE_CLOCK_DOMAIN_LOST and never recreates time from UTC. ProcessView deadline is immutable for one process identity.
ShutdownReceipt links only an exact accepted shutdown ControlReceipt. Corrupt linkage returns one unavailable/no-receipt SHUTDOWN_CONTROL_LINK_CORRUPT product and resolves one idempotent ShutdownLinkIntegrityObservationV1/outbox. A durable pending-to-claimed transition records stable signal and current owner/fence identity before the sole external call; ordinary completion is delivered or delivery_failed, while any post-claim crash without a terminal commit becomes delivery_outcome_unknown after claim expiry and never triggers an automatic second call. Verified mutation authority and process-local monotonic Deadline remain separate admission/runtime evidence and are never reconstructed from receipt bytes.
Platform-owned DurableEnvelopeProjectionV1 preserves exact metadata/descriptor/payload identity but excludes authority, local deadline and attempt state; its sole binary bytes are the exact input to ContentDigest and decode creates neither authority nor budget. OwnerCodecManifestV1 mechanically binds descriptor and executable capability; fresh typed validation performs one encode, durable validation one decode plus one exact re-encode, and later projection/digest work reuses the validated bytes. Platform alone owns codec-dependent durable identities. Each identity transaction updates at most one deterministic one-of-16 retention shard with at most three CAS attempts and never clones a whole manifest. Bootstrap/retirement closes ingress and retention mutation admission, drains in-flight shard transactions, holds the current owner fence plus exclusive snapshot lease, binds one stable 16-shard revision vector and atomically publishes the sole generation/count/source-revision-digest/entry-digest-bound RequiredOwnerCodecManifestV1 pointer and snapshot. Bootstrap validates that current snapshot against the same frozen revision vector under a finite deadline without scanning durable rows and reports CODEC_REGISTRY_REQUIRED_CODEC_UNAVAILABLE when exact historical capability cannot be proven. Processes persists only projection-independent handoff facts and cannot write Platform retention accounting. Redacted caller/readiness products remain distinct from the authorized closed operator cause/action observation.
Root, child, retry, redelivery, duplicate and replay causal propagation is closed. ReplayContextV1 preserves immutable historical actor/message attribution separately from the exact current replay request/correlation/optional-causation tuple, current initiator and policy evidence. ReplayAdmissionV1 binds the exact projection digest/identity and required operation to current authority before existence disclosure. Direct replay is resolve-only, leaves the historical receipt unchanged, and uses (owner_namespace, replay_request_message_id) to commit one at-most-2,048-byte current-initiator audit before returning that receipt. First-audit occurred_at is sampled only after operation resolution and immediately before fact construction; retry preserves the first value without a second sample, and the value is only Platform replay-audit observation time, never event, source, publication, received, available, PIT, deadline, transaction-completion or response time.
Replay trusted-clock failure returns clockless REPLAY_AUDIT_CLOCK_UNAVAILABLE with no audit/receipt/fallback time; shutdown-link integrity clock failure separately returns clockless SHUTDOWN_LINK_INTEGRITY_CLOCK_UNAVAILABLE with no observation/outbox/fallback time; transaction/deadline or persistence failure returns REPLAY_AUDIT_UNAVAILABLE. One bounded health signal has closed clock_unavailable, transaction_unavailable or persistence_unavailable kind and no producer wall-clock timestamp. A domain-separated internal binding digest excludes only the attempt deadline, is never public and rejects same-request binding conflict before operation lookup; missing operations are not created. Both replay-audit failure products have no receipt/link/retry/background continuation. Every pre-operation refusal/error/audit/event safely links the current request message, correlation and optional direct cause within its bounded allowlist. A terminal idempotency conflict/corruption/contention reason is exposed only after one immutable refusal fact with a closed 2,048-byte allowlist commits; when that audit cannot start or commit under the shared deadline, IDEMPOTENCY_AUDIT_UNAVAILABLE wins. Corruption also makes one bounded integrity-alert attempt.
"""

[evidence.concurrency]
ownership = "This child owns immutable control DTO semantics and bounded test doubles only; it starts no production worker. Future Platform Execution exclusively owns command-admission claims, operation/control/shutdown receipts and every OperationReceipt lifecycle transition. Processes exclusively owns ProcessStartKeyV1/inbox claims, Process Manager workflow state and ProcessView. These owners do not share transactions or secret/idempotency material, and an owning adapter retains its process/thread/audit/lease/fence generation until structured terminal evidence exists. Current runtime adoption is a hard-gated separate child enforced by both a legacy-to-target import allowlist and a production-inbound prohibition on all four compatibility leaf adapters."
bound = "V1 checks raw input and canonical output at 65,536 bytes, nested containers at depth 8, strings/keys at 2,048 UTF-8 bytes, canonical integer tokens at 19 digits, each container at 100 members, aggregate members at 1,024, value nodes at 2,048, actor scopes at 32, delegation hops at 8, process history at 50, recovery descriptors at 16, owner codec descriptors and required-codec manifest entries at 4,096 with retained historical codecs counted, exactly 16 retention shards, at most one shard row touched and three CAS attempts per dependent transaction, at most 65,536 shard rows aggregated only while ingress is closed/current owner fence held, binary search over the immutable sorted tuple and at most 13 key comparisons per manifest entry under one finite startup deadline, safe error text at 1,024 bytes, legacy EventBus canonical mapping at 1,024 source handler results, and all fields at their exact domains. Startup never scans dependent durable rows or accepts a stale/non-current snapshot. DurableEnvelopeProjectionV1 uses one fixed domain and bounded length framing, remains within 65,536 bytes, excludes actor/deadline/attempt state and has no JSON alternative; a descriptor payload limit does not waive the total projection limit. Fresh typed payload validation performs exactly one owner encode; projection reuses that immutable bytes object, allocates one bounded output buffer, and bytes-consuming digest derivation does not re-encode. Durable payload validation performs one decode plus one re-encode. Projection and registry failures use nine closed codes; request failures expose only bounded owner/schema/version/purpose identity and Bootstrap failures expose only code/descriptor count/permitted manifest count. An authorized health observation adds one of 17 closed causes and one exact closed recovery action without descriptor, key, payload, callback, exception or path. UtcInstant has one exact six-fractional-digit Z form and rejects alternate offset/precision/leap