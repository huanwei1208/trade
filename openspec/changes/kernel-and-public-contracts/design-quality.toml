owner = "src/trade/kernel reference identity with future Context contract owners"
paths = [
  "src/trade/kernel/refs.py",
  "tests/unit/kernel/test_refs.py",
  "tests/contract/public_contracts/",
]
contracts = [
  "owner, kind, object, version and digest reference identity",
  "path-free and moving-alias-free formal reference policy",
  "immutable PolicyRef identity",
  "owner validation after wire decoding",
]
failure_states = [
  "path or mutable alias in formal reference",
  "missing referenced content",
  "unsupported reference version",
  "legacy artifact over-promoted to formal reference",
  "wire decode mistaken for publication or PIT proof",
]
spec_requirements = [
  "immutable-reference-policy:Immutable reference identity SHALL preserve owner, type, version and content",
  "immutable-reference-policy:Formal references SHALL exclude mutable aliases and storage locations",
  "immutable-reference-policy:Policy references SHALL identify immutable policy content",
  "immutable-reference-policy:Reference construction and wire decoding SHALL fail closed",
]
validation_tasks = ["1.1", "1.2", "1.3", "2.2", "4.1", "5.1", "5.2", "5.3"]

