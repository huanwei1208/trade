Operation/process deadline goldens resolve immutable admission facts; live same-domain retries consume the original monotonic binding, restart/lost binding executes zero work, UTC rollback/forward/unavailable cannot create time, and ProcessView transitions reject deadline changes. Process goldens freeze the internal ProcessStartKeyV1 tuple and prove ProcessView exposes neither owner's claim material.
